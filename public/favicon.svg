<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Bee Garden's tab icon: a little honeybee on a cream disc, in the game's watercolour colours. -->
  <circle cx="32" cy="32" r="31" fill="#f6efd8"/>
  <circle cx="32" cy="32" r="30" fill="none" stroke="#d9cfa8" stroke-width="1.5"/>
  <!-- Wings, pale and see-through, raised over the back. -->
  <ellipse cx="27" cy="20" rx="8.5" ry="12" transform="rotate(-28 27 20)" fill="#e2eff5" fill-opacity=".92" stroke="#7f97a5" stroke-width="2"/>
  <ellipse cx="39" cy="20" rx="8" ry="11" transform="rotate(22 39 20)" fill="#e2eff5" fill-opacity=".92" stroke="#7f97a5" stroke-width="2"/>
  <!-- Body: amber with two dark bands, and a small sting. -->
  <clipPath id="body"><ellipse cx="35" cy="38" rx="15" ry="11"/></clipPath>
  <path d="M49 38l5 1.5-5 1.5z" fill="#3b2f22"/>
  <ellipse cx="35" cy="38" rx="15" ry="11" fill="#eaa72e"/>
  <g clip-path="url(#body)" fill="#3b2f22">
    <rect x="30" y="25" width="4.5" height="26"/>
    <rect x="39.5" y="25" width="4.5" height="26"/>
  </g>
  <ellipse cx="35" cy="38" rx="15" ry="11" fill="none" stroke="#3b2f22" stroke-width="2.5"/>
  <!-- Head and antennae. -->
  <circle cx="17" cy="37" r="7" fill="#3b2f22"/>
  <circle cx="15.2" cy="35.2" r="1.6" fill="#f6efd8"/>
  <path d="M15 31c-2-4-4-6-7-6M19 30.5c0-4 1-6.5 3.5-8" fill="none" stroke="#3b2f22" stroke-width="2" stroke-linecap="round"/>
</svg>
